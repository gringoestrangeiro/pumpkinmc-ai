[files]
# roadmap.md quotes upstream issue and PR titles verbatim.
extend-exclude = ["assets/", "crates/pumpkin-data/src/generated", "roadmap.md"]

[default.extend-words]
handled = "handled"
received = "received"
ba = "ba"
fo = "fo"
undescore = "undescore"
replaceables = "replaceables"
convertable = "convertable"

[default.extend-identifiers]
# Vanilla method names
areMergable = "areMergable"
isMergable = "isMergable"
# Vanilla `NoiseBasedAquifer` constant name.
FLOWING_UPDATE_SIMULARITY = "FLOWING_UPDATE_SIMULARITY"
